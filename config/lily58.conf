# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
# CONFIG_ZMK_DISPLAY=y
# 有線分割を有効化
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_WIRED=y

# 左側をCentral（メイン）側に設定
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# RP2040向けUARTモード（Interruptモードを推奨）
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
# またはAsyncモードが安定する場合は
# CONFIG_ZMK_SPLIT_WIRED_UART_MODE_ASYNC=y

# Bluetoothは無効化（有線のみの場合）
CONFIG_ZMK_BLE=n